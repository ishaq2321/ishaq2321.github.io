name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  should-deploy:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check if deploy is needed
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "deploy")
          echo "Changed files: $CHANGED"

          DEPLOY=false
          for file in $CHANGED; do
            case "$file" in
              app/*|portfolio.config.json|public/*|lib/*|scripts/*|package.json|package-lock.json|.github/workflows/deploy.yml)
                DEPLOY=true
                break
                ;;
            esac
          done

          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
          echo "Deploy decision: $DEPLOY"

  build:
    runs-on: ubuntu-latest
    needs: [should-deploy]
    if: needs.should-deploy.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.should-deploy.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
