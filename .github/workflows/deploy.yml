name: Deploy to GitHub Pages

# Action versions are pinned to majors that declare `runs.using: node24`.
# node20 actions still work, but the runner force-upgrades them and emits a
# deprecation annotation on every job, which buries real failures in the log.
#
# Paired deliberately: upload-pages-artifact@v5 wraps upload-artifact@v7 (v3
# wrapped @v4, which is where this workflow's warning came from), and
# deploy-pages@v5 is the matching deploy half. Bump the two together.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  should-deploy:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check if deploy is needed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # The whole push, not just its tip. Comparing HEAD^..HEAD looked equivalent and
          # wasn't: a push of five commits whose *last* one only edited the README reported
          # "Changed files: README.md" and skipped the build, so the four commits that had
          # changed the site never reached Pages.
          #
          # When the range cannot be worked out -- a force-push leaves the previous tip
          # unreachable, and `actions/checkout` cannot fetch a commit that is gone -- ship
          # anyway. A needless build costs a minute; silently not shipping cost a
          # deployment, which is how this was found.
          KNOWN=false
          CHANGED=""
          ZERO=0000000000000000000000000000000000000000
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
            KNOWN=true
          elif [ "$BEFORE" = "$ZERO" ] && git rev-parse -q --verify HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
            KNOWN=true
          fi

          DEPLOY=false
          if [ "$KNOWN" = true ] && [ -n "$CHANGED" ]; then
            for file in $CHANGED; do
              case "$file" in
                app/*|portfolio.config.json|public/*|lib/*|scripts/*|package.json|package-lock.json|.github/workflows/deploy.yml)
                  DEPLOY=true
                  break
                  ;;
              esac
            done
          else
            DEPLOY=true
          fi

          echo "Changed files: ${CHANGED:-<range unknown>}"
          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
          echo "Deploy decision: $DEPLOY"

  build:
    runs-on: ubuntu-latest
    needs: [should-deploy]
    if: needs.should-deploy.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Two personal files are not in this repository: the hero photograph and the
      # Tsinghua offer letter. They are generated/kept locally and
      # carried here as base64 in repository secrets, because committing them would
      # publish them forever, including in the git history. With no secret - a fork, or a
      # pull request from one - nothing is written and the site degrades instead of
      # shipping a broken image or a 404 link.
      - name: Materialise the personal files that are not in this repository
        env:
          PORTRAIT_B64: ${{ secrets.PORTRAIT_B64 }}
          OFFER_LETTER_KEY: ${{ secrets.OFFER_LETTER_KEY }}
        run: |
          set -euo pipefail

          # Signatures, read in one go (a `tail | head` pipeline dies of SIGPIPE under
          # `pipefail` and would report exit 141 instead of a message): WebP is
          # RIFF + 4 length bytes + WEBP, PDF is %PDF.
          check() {
            header=$(od -An -tx1 -N 12 "public/$1" | tr -d ' \n')
            case "$2:$header" in
              webp:52494646????????57454250) ;;
              pdf:25504446????????????????) ;;
              *)
                echo "::error::public/$1 is not a $2 file (header $header) - refusing to ship it."
                exit 1
                ;;
            esac
            echo "public/$1: $(stat -c %s "public/$1") bytes, sha256 $(sha256sum "public/$1" | cut -d' ' -f1)"
          }

          # Small files ride as base64 in a secret. 48 KB is GitHub's limit per secret
          # and 128 KB is the kernel's per-string limit for a process environment, so
          # only the 17 KB and 12 KB WebPs can travel this way.
          from_secret() {
            name="$1"; data="$2"; without="$3"; kind="$4"
            if [ -z "$data" ]; then
              echo "::warning::secret for $name is not set - $without"
              return 0
            fi
            if ! printf '%s' "$data" | base64 -d > "public/$name"; then
              echo "::error::secret for $name is not valid base64 - re-run: base64 -w0 public/$name | gh secret set ..."
              exit 1
            fi
            check "$name" "$kind"
          }

          # The 670 KB offer letter cannot: base64 of it is 893 KB. So the repository
          # carries it encrypted (encrypted/offer-letter.pdf.enc) and only the key is a
          # secret. Ciphertext in a public repository reveals nothing, while the URL
          # crawlers and raw.githubusercontent.com would find serves gibberish.
          from_encrypted() {
            name="$1"; key="$2"; without="$3"
            if [ -z "$key" ]; then
              echo "::warning::secret for $name is not set - $without"
              return 0
            fi
            if ! printf '%s' "$(printf '%s' "$key" | tr -d '\r\n')" \
                 | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass stdin \
                     -in encrypted/offer-letter.pdf.enc -out "public/$name" 2>/dev/null; then
              echo "::error::could not decrypt encrypted/offer-letter.pdf.enc - is OFFER_LETTER_KEY the key it was encrypted with?"
              exit 1
            fi
            check "$name" pdf
          }

          from_secret portrait.webp "$PORTRAIT_B64" \
            "the hero will render the monogram rather than a photo." webp
          from_encrypted tsinghua-offer.pdf "$OFFER_LETTER_KEY" \
            "the Tsinghua chip will link to a missing file."
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The site is dark only on purpose, and this is a regression that hides: it shows
      # up on a machine that prefers light, and only if someone opens the page there.
      # The guard renders the export in every colour-scheme state and fails the build if
      # a light palette, a theme toggle, or an unpainted hero comes back — see
      # scripts/check-palette.mjs for what it asserts, and scripts/test-palette-guard.sh
      # (run it locally against a build) for proof that it fails when it should.
      - name: Guard the palette (dark only)
        run: npm run check:palette
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.should-deploy.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
